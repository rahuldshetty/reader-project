name: 'Release Version'

on:
  push:
    tags:
      - 'v*' # release by pushing a tag, e.g. `git tag v0.2.7 && git push origin v0.2.7`
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.7)'
        required: true
        type: string

jobs:
  # A release can reach this workflow two ways: a tag you push, or the tag GitHub
  # creates when a draft (built through the workflow_dispatch path) gets published.
  # The second one is a rebuild of a finished release, so skip it.
  # A draft release cannot be fetched by tag, so a pre-made draft still falls
  # through to the build below, where the action attaches assets to it.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: check for an already-published tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] &&
             gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '(.assets | length) > 0' 2>/dev/null | grep -q true; then
            echo "::notice::$GITHUB_REF_NAME already has a published release with assets, nothing to build."
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-latest' # Android APK (see `mobile` below)
            mobile: 'android'
            args: ''
            # `--apk` skips the AAB; `--debug` is appended when no signing secrets exist.
            assetNamePattern: '[name]_[platform]_[arch]-[mode][ext]'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The tag (or the dispatch input) is the only source of truth for the version.
      # It is written into the checkout for this build only and never committed.
      # package.json holds the single stored copy; src-tauri/tauri.conf.json points at it.
      - name: resolve version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain x.y.z version (Windows installers reject pre-release suffixes)."
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version --force
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libxdo-dev

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Apple targets only for macOS jobs, Android targets only for the Android job.
          targets: ${{ matrix.mobile == 'android' && 'aarch64-linux-android,armv7-linux-androideabi' || (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '') }}

      # Android tooling is only needed by the `mobile: android` matrix entry.
      - name: setup JDK
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v4

      - name: install Android SDK packages
        if: matrix.mobile == 'android'
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: setup Android NDK
        if: matrix.mobile == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      # Signs with the upload keystore when the secrets exist; otherwise builds a
      # debug-signed APK so the workflow still produces an installable artifact.
      - name: configure Android signing
        if: matrix.mobile == 'android'
        id: android-signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF
            echo "build_args=--apk --target aarch64 --target armv7" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android signing secrets are missing; building a debug-signed APK. Add ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish a release-signed APK."
            echo "build_args=--apk --debug --target aarch64 --target armv7" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: bun install # change this to npm or pnpm depending on which one you use.

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          tagName: v${{ env.VERSION }} # the tag drives the release, not a hardcoded config value
          releaseName: 'App v${{ env.VERSION }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          # Version-free asset names so docs/index.html can link to
          # releases/latest/download/<name> and never need editing again.
          releaseAssetNamePattern: ${{ matrix.assetNamePattern || '[name]_[platform]_[arch][setup][ext]' }}
          args: ${{ matrix.mobile == 'android' && steps.android-signing.outputs.build_args || matrix.args }}
          mobile: ${{ matrix.mobile }}
